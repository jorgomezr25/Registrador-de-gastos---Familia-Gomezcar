<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Registrador de gastos - Familia Gomezcar">
  <title>Presupuesto Familia</title>
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22:%22Presupuesto%20Familia%22,%22short_name%22:%22Presupuesto%22,%22start_url%22:%22.%22,%22scope%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%23ffffff%22,%22icons%22:%5B%5D%7D">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; }
    body { padding-bottom: 20px; }
    .header { background: #fff; border-bottom: 0.5px solid #e0e0e0; padding: 16px; text-align: center; position: sticky; top: 0; z-index: 10; }
    .header h1 { font-size: 18px; color: #1a1a1a; font-weight: 500; }
    .header p { font-size: 13px; color: #999; margin-top: 4px; }
    .tabs { display: flex; gap: 0; background: #fff; border-bottom: 0.5px solid #e0e0e0; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-size: 13px; color: #999; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab-btn.active { color: #378add; border-bottom-color: #378add; }
    .container { max-width: 100%; }
    .section { display: none; padding: 16px; }
    .section.active { display: block; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 500; }
    .form-group select, .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 0.5px solid #d0d0d0; border-radius: 6px; font-size: 16px; font-family: inherit; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #378add; }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .btn { width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: 500; }
    .btn-primary { background: #378add; color: white; }
    .btn-primary:active { opacity: 0.9; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .card { background: white; border-radius: 8px; border: 0.5px solid #e0e0e0; padding: 16px; margin-bottom: 12px; }
    .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .stat { background: #f9f9f9; padding: 12px; border-radius: 6px; border: 0.5px solid #e0e0e0; }
    .stat-label { font-size: 12px; color: #999; margin-bottom: 4px; }
    .stat-value { font-size: 20px; font-weight: 500; color: #1a1a1a; }
    .list-item { padding: 12px; border-bottom: 0.5px solid #e0e0e0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .list-item:last-child { border-bottom: none; }
    .list-item-left { flex: 1; }
    .list-item-desc { font-size: 14px; color: #1a1a1a; font-weight: 500; }
    .list-item-cat { font-size: 12px; color: #999; margin-top: 2px; }
    .list-item-meta { font-size: 11px; color: #bbb; margin-top: 2px; }
    .list-item-amount { font-size: 15px; font-weight: 500; color: #378add; text-align: right; white-space: nowrap; }
    .list-item-badge { display: inline-block; padding: 2px 6px; font-size: 10px; background: #e3f2fd; color: #1976d2; border-radius: 3px; margin-top: 4px; }
    .empty-state { text-align: center; padding: 40px 16px; color: #999; }
    .empty-state p { font-size: 14px; }
    .delete-btn { background: #f5f5f5; border: none; color: #999; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .delete-btn:active { background: #e0e0e0; }
    .summary-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 0.5px solid #e0e0e0; }
    .summary-row:last-child { border-bottom: none; }
    .summary-label { font-size: 14px; color: #666; }
    .summary-value { font-size: 14px; font-weight: 500; color: #1a1a1a; }
    .progress-bar { width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; margin-top: 8px; }
    .progress-fill { height: 100%; background: #378add; border-radius: 3px; }
    .sync-section { background: #f0f7ff; border: 0.5px solid #90caf9; border-radius: 6px; padding: 12px; margin-bottom: 16px; }
    .sync-status { font-size: 13px; color: #1976d2; margin-bottom: 8px; }
    .alert { padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
    .alert-success { background: #e8f5e9; color: #2e7d32; border: 0.5px solid #81c784; }
    .alert-error { background: #ffebee; color: #c62828; border: 0.5px solid #ef5350; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Presupuesto Familia</h1>
    <p id="current-month">Septiembre 2026</p>
  </div>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('register')">Registrar</button>
    <button class="tab-btn" onclick="switchTab('dashboard')">Dashboard</button>
    <button class="tab-btn" onclick="switchTab('history')">Historial</button>
    <button class="tab-btn" onclick="switchTab('sync')">Sincronizar</button>
  </div>
  
  <div class="container">
    <div id="register" class="section active">
      <div style="padding: 16px;">
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" id="date" required>
        </div>
        <div class="form-group">
          <label>Categoría</label>
          <select id="category" onchange="updateSubcategories()">
            <option value="">Elige una categoría</option>
          </select>
        </div>
        <div class="form-group">
          <label>Subcategoría</label>
          <select id="subcategory">
            <option value="">Elige una subcategoría</option>
          </select>
        </div>
        <div class="form-group">
          <label>Descripción (opcional)</label>
          <textarea id="description" placeholder="Ej: Frutas, verduras, lácteos..."></textarea>
        </div>
        <div class="form-group">
          <label>Monto ($)</label>
          <input type="number" id="amount" placeholder="0" min="0">
        </div>
        <div class="form-group">
          <label>Medio de pago</label>
          <select id="method">
            <option value="">Elige un medio</option>
            <option value="Davivienda efectivo">Davivienda efectivo</option>
            <option value="Bancolombia efectivo">Bancolombia efectivo</option>
            <option value="Tarjeta Davivienda">Tarjeta Davivienda</option>
            <option value="Tarjeta Falabella Nelcy">Tarjeta Falabella Nelcy</option>
            <option value="Tarjeta Falabella Jorge">Tarjeta Falabella Jorge</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="registerPayment()">Registrar pago</button>
      </div>
    </div>
    
    <div id="dashboard" class="section">
      <div style="padding: 16px;">
        <div class="card">
          <div class="stat-row">
            <div class="stat">
              <div class="stat-label">Presupuestado</div>
              <div class="stat-value" id="stat-budgeted">$0</div>
            </div>
            <div class="stat">
              <div class="stat-label">Ejecutado</div>
              <div class="stat-value" id="stat-executed">$0</div>
            </div>
          </div>
          <div class="summary-label" style="font-size: 12px; color: #999; margin-top: 12px;">Avance</div>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
          </div>
          <div class="summary-row" style="padding: 12px 0 0;">
            <span id="progress-pct">0%</span>
            <span id="remaining" style="color: #378add;">$0 disponible</span>
          </div>
        </div>
        <div class="card">
          <div style="font-size: 14px; font-weight: 500; margin-bottom: 12px; color: #1a1a1a;">Por categoría</div>
          <div id="category-summary"></div>
        </div>
        <div class="card">
          <div style="font-size: 14px; font-weight: 500; margin-bottom: 12px; color: #1a1a1a;">Por medio de pago</div>
          <div id="method-summary"></div>
        </div>
      </div>
    </div>
    
    <div id="history" class="section">
      <div style="padding: 16px;">
        <div class="card">
          <div id="payment-list"></div>
          <div id="empty-message" class="empty-state">
            <p>Ningún pago registrado aún</p>
          </div>
        </div>
      </div>
    </div>
    
    <div id="sync" class="section">
      <div style="padding: 16px;">
        <div class="card">
          <div style="font-size: 16px; font-weight: 500; margin-bottom: 16px; color: #1a1a1a;">Sincronizar con Google Sheets</div>
          <div id="sync-alert"></div>
          <div class="sync-section">
            <div class="sync-status" id="sync-status">
              Registros no sincronizados: <strong id="unsync-count">0</strong>
            </div>
            <button class="btn btn-primary" onclick="syncToSheets()" id="sync-btn">Sincronizar ahora</button>
          </div>
          <div class="card" style="margin-top: 0; padding: 0;">
            <div style="font-size: 14px; font-weight: 500; padding: 16px; color: #1a1a1a; border-bottom: 0.5px solid #e0e0e0;">Estado de sincronización</div>
            <div id="sync-history" style="padding: 0;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyP3UzDqwafKIiZxHiqcVPMrvx_JKUbpkWItmXiEw2xnzDDq8gMKnsLNKCOXMLgG7T2/exec";
    const BUDGET_DATA = {
      "BALCONES RUITOQUE": { items: [{ nombre: "Mercado", monto: 2600000 }, { nombre: "Empleada doméstica (mes vencido)", monto: 2700000 }, { nombre: "Agua ( vence 13) descontado directamente de davivienda", monto: 330000 }, { nombre: "Energía (Vence 13)", monto: 270000 }, { nombre: "Gas (Vence 8)", monto: 120000 }, { nombre: "Internet  (Vence 25)", monto: 90000 }, { nombre: "Administración (Vence 18)", monto: 424500 }] },
      "COLEGIO": { items: [{ nombre: "Pensión Nico", monto: 1065600 }, { nombre: "Pensión Angel", monto: 1105600 }, { nombre: "Lonchera Nico", monto: 200000 }, { nombre: "Lonchera Ángel", monto: 200000 }, { nombre: "Imprevistos DEL COLEGIO (domicilio almuerzo)", monto: 400000 }] },
      "GENERALES": { items: [{ nombre: "exequias La colina", monto: 30000 }, { nombre: "Plataformas: Icloud (15 de cada mes)", monto: 90000 }, { nombre: "Plataformas: Netflix (25 de cada mes)", monto: 29900 }, { nombre: "Plataformas: HBO", monto: 15000 }, { nombre: "CLAUDE", monto: 330000 }, { nombre: "GEMINI", monto: 70000 }, { nombre: "Celular Nelcy", monto: 41000 }, { nombre: "Cel Jorge (10 de cada mes)", monto: 48000 }, { nombre: "Celular Nico (10 de cada mes)", monto: 44000 }, { nombre: "Celular Angelito", monto: 45000 }, { nombre: "Cel Leonor (9 de cada mes)", monto: 21000 }, { nombre: "Cel Mercedes (6 de cada mes)", monto: 21000 }, { nombre: "Seguridad social  20 junio independiente", monto: 534200 }, { nombre: "Mensualidad doña Leonor", monto: 500000 }, { nombre: "Milo Comida (cuenta Melgarejo SAS 291-000422-72)", monto: 130000 }, { nombre: "Milo Peluqería", monto: 90000 }, { nombre: "Milo purga", monto: 70000 }, { nombre: "Medicina", monto: 200000 }, { nombre: "Productos ANGEL y NICO", monto: 100000 }, { nombre: "cortes de cabello y belleza", monto: 300000 }, { nombre: "Salidas familia", monto: 1000000 }] },
      "SANTA MARTA": { items: [{ nombre: "Admon (Vence 10)", monto: 190000 }, { nombre: "Internet (vence 18 de mes)", monto: 75000 }, { nombre: "Servicio Gas (Vence 27)", monto: 20000 }, { nombre: "Servicio de agua", monto: 25000 }, { nombre: "Servicio de energia (Vence 10 de cada mes)", monto: 180000 }, { nombre: "8 pasajes Copetran", monto: 800000 }, { nombre: "Alimentacion y transporte", monto: 600000 }] },
      "OTROS": { items: [{ nombre: "Limosna", monto: 100000 }, { nombre: "MFC", monto: 30000 }, { nombre: "Otros de la Parroquia", monto: 50000 }, { nombre: "Gasolina", monto: 600000 }, { nombre: "Arriendo Parqueadero Balcones March", monto: 60000 }, { nombre: "Lavados carro", monto: 200000 }] },
      "CRÉDITOS ORDINARIOS": { items: [{ nombre: "cuota March", monto: 1400000 }, { nombre: "Cuota scotibank colpatria 5 de cada mes.", monto: 410000 }, { nombre: "Davivienda complemento viaje Paris", monto: 1564000 }, { nombre: "Todoriesgo Koleos", monto: 455000 }, { nombre: "Seguro Vida Renault", monto: 170000 }, { nombre: "Crédito Colpatria", monto: 2325000 }] },
      "CRÉDITOS HIPOTECARIOS": { items: [{ nombre: "Hipoteca BBVA (Vence 01)", monto: 1584000 }] }
    };
    function initCategories() { const select = document.getElementById('category'); Object.keys(BUDGET_DATA).forEach(cat => { const option = document.createElement('option'); option.value = cat; option.textContent = cat; select.appendChild(option); }); }
    function getCurrentMonthKey() { const today = new Date(); const year = today.getFullYear(); const month = String(today.getMonth() + 1).padStart(2, '0'); return `${year}_${month}`; }
    function generatePaymentId() { const now = new Date(); const timestamp = now.getTime().toString(36); const random = Math.random().toString(36).substring(2, 9); return `${timestamp}-${random}`; }
    let payments = JSON.parse(localStorage.getItem(`payments_${getCurrentMonthKey()}`)) || [];
    function updateSubcategories() { const category = document.getElementById('category').value; const subcategorySelect = document.getElementById('subcategory'); subcategorySelect.innerHTML = '<option value="">Elige una subcategoría</option>'; if (category && BUDGET_DATA[category]) { BUDGET_DATA[category].items.forEach(item => { const option = document.createElement('option'); option.value = item.nombre; option.textContent = item.nombre; subcategorySelect.appendChild(option); }); } }
    function switchTab(tab) { document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById(tab).classList.add('active'); event.target.classList.add('active'); if (tab === 'dashboard') updateDashboard(); if (tab === 'history') updateHistory(); if (tab === 'sync') updateSyncStatus(); }
    function registerPayment() { const date = document.getElementById('date').value; const category = document.getElementById('category').value; const subcategory = document.getElementById('subcategory').value; const description = document.getElementById('description').value; const amount = parseInt(document.getElementById('amount').value); const method = document.getElementById('method').value; if (!date || !category || !subcategory || !amount || !method) { alert('Completa todos los campos obligatorios'); return; } const payment = { id: generatePaymentId(), date, category, subcategory, description, amount, method, synced: false, syncedAt: null }; payments.push(payment); localStorage.setItem(`payments_${getCurrentMonthKey()}`, JSON.stringify(payments)); document.getElementById('category').value = ''; document.getElementById('subcategory').value = ''; document.getElementById('description').value = ''; document.getElementById('amount').value = ''; document.getElementById('method').value = ''; document.getElementById('date').valueAsDate = new Date(); alert('Pago registrado ✓'); }
    function updateDashboard() { const totalBudget = Object.values(BUDGET_DATA).reduce((sum, cat) => sum + cat.items.reduce((s, item) => s + item.monto, 0), 0); const totalExecuted = payments.reduce((sum, p) => sum + p.amount, 0); const remaining = totalBudget - totalExecuted; const percentage = Math.round((totalExecuted / totalBudget) * 100); document.getElementById('stat-budgeted').textContent = '$' + totalBudget.toLocaleString('es-CO'); document.getElementById('stat-executed').textContent = '$' + totalExecuted.toLocaleString('es-CO'); document.getElementById('progress-fill').style.width = percentage + '%'; document.getElementById('progress-pct').textContent = percentage + '%'; document.getElementById('remaining').textContent = '$' + remaining.toLocaleString('es-CO') + ' disponible'; let categorySummary = ''; for (const [cat, data] of Object.entries(BUDGET_DATA)) { const catTotal = data.items.reduce((s, item) => s + item.monto, 0); const executed = payments.filter(p => p.category === cat).reduce((sum, p) => sum + p.amount, 0); const pct = Math.round((executed / catTotal) * 100); categorySummary += `<div class="summary-row"><span class="summary-label">${cat}</span><div style="text-align: right;"><div class="summary-value">${pct}%</div><div style="font-size: 12px; color: #999;">$${executed.toLocaleString('es-CO')} / $${catTotal.toLocaleString('es-CO')}</div></div></div>`; } document.getElementById('category-summary').innerHTML = categorySummary; let methodSummary = ''; const methods = new Set(payments.map(p => p.method)); methods.forEach(method => { const methodTotal = payments.filter(p => p.method === method).reduce((sum, p) => sum + p.amount, 0); methodSummary += `<div class="summary-row"><span class="summary-label">${method}</span><span class="summary-value">$${methodTotal.toLocaleString('es-CO')}</span></div>`; }); document.getElementById('method-summary').innerHTML = methodSummary || '<p style="color: #999; font-size: 14px;">Sin pagos registrados</p>'; }
    function updateHistory() { const list = document.getElementById('payment-list'); const empty = document.getElementById('empty-message'); if (payments.length === 0) { list.innerHTML = ''; empty.style.display = 'block'; return; } empty.style.display = 'none'; list.innerHTML = payments.map((p, i) => `<div class="list-item"><div class="list-item-left"><div class="list-item-desc">${p.subcategory}</div><div class="list-item-cat">${p.category} · ${p.method}</div>${p.description ? `<div class="list-item-meta">"${p.description}"</div>` : ''}<div class="list-item-meta">${p.date}</div>${p.synced ? `<div class="list-item-badge">✓ Sincronizado</div>` : ''}</div><div><div class="list-item-amount">$${p.amount.toLocaleString('es-CO')}</div><button class="delete-btn" onclick="deletePayment(${i})">Eliminar</button></div></div>`).join(''); }
    function deletePayment(index) { if (confirm('¿Eliminar este pago?')) { payments.splice(index, 1); localStorage.setItem(`payments_${getCurrentMonthKey()}`, JSON.stringify(payments)); updateHistory(); } }
    function updateSyncStatus() { const unsyncedCount = payments.filter(p => !p.synced).length; document.getElementById('unsync-count').textContent = unsyncedCount; const history = payments.filter(p => p.synced).reverse().slice(0, 10); if (history.length === 0) { document.getElementById('sync-history').innerHTML = '<p style="padding: 16px; color: #999;">Sin registros sincronizados</p>'; return; } document.getElementById('sync-history').innerHTML = history.map(p => `<div class="list-item"><div class="list-item-left"><div style="font-size: 13px; color: #1a1a1a;">${p.subcategory}</div><div style="font-size: 11px; color: #999; margin-top: 2px;">Sincronizado ${new Date(p.syncedAt).toLocaleString('es-CO')}</div></div><div style="color: #388e3c; font-size: 13px; font-weight: 500;">$${p.amount.toLocaleString('es-CO')}</div></div>`).join(''); }
    async function syncToSheets() { const unsyncedPayments = payments.filter(p => !p.synced); if (unsyncedPayments.length === 0) { showAlert('No hay registros sin sincronizar', 'error'); return; } const btn = document.getElementById('sync-btn'); btn.disabled = true; btn.textContent = 'Sincronizando...'; try { const payload = { monthKey: getCurrentMonthKey(), payments: unsyncedPayments }; const response = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'application/json' } }); const result = await response.json(); if (result.success) { unsyncedPayments.forEach(p => { const payment = payments.find(pym => pym.id === p.id); if (payment) { payment.synced = true; payment.syncedAt = new Date().toISOString(); } }); localStorage.setItem(`payments_${getCurrentMonthKey()}`, JSON.stringify(payments)); btn.disabled = false; btn.textContent = 'Sincronizar ahora'; showAlert(`✓ ${result.processed} registros sincronizados exitosamente`, 'success'); updateSyncStatus(); updateHistory(); } else { throw new Error(result.mensaje || result.error || 'Error desconocido'); } } catch (error) { btn.disabled = false; btn.textContent = 'Sincronizar ahora'; showAlert('Error: ' + error.message, 'error'); } }
    function showAlert(message, type) { const alertDiv = document.getElementById('sync-alert'); const className = type === 'success' ? 'alert-success' : 'alert-error'; alertDiv.innerHTML = `<div class="alert ${className}">${message}</div>`; setTimeout(() => { alertDiv.innerHTML = ''; }, 5000); }
    document.addEventListener('DOMContentLoaded', () => { initCategories(); const today = new Date(); document.getElementById('date').valueAsDate = today; const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre']; document.getElementById('current-month').textContent = monthNames[today.getMonth()] + ' ' + today.getFullYear(); });
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>e.waitUntil(clients.claim()));'); }
  </script>
</body>
</html>
